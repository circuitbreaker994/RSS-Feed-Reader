<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>RSS Feed</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Catch up on what's new</h1>
        
        <div id="tokenSetup">
            <input type="text" id="tokenInput" placeholder="Paste your Github token">
            <button id="saveTokenBtn">Save token</button>
        </div>
        
        <input type="text" id="feedUrlInput" placeholder="Paste a feed URL">
        <button id="addFeedBtn">Add feed</button>
        
        <ul id="FeedList"></ul>

        <ul id="itemList"></ul>

        <script>
            //start github token
            const GIST_ID = '56b9e3cc7ff26371316fa4c95bbc6c4f';
            
            function getToken() {
                return localStorage.getItem('githubToken');
            }
            
            document.getElementById('saveTokenBtn').addEventListener('click', function() {
                const tokenInput = document.getElementById('tokenInput');
                localStorage.setItem('githubToken', tokenInput.value);
                tokenInput.value = '';
                alert('Token save on this device.');
            });
            //end github token
            //start point to feeds
            let feedUrls = [];

            async function loadFeedUrls() {
                const response = await fetch('https://api.github.com/gists/' + GIST_ID);
                const gist = await response.json();
                const fileContent = gist.files['feeds.json'].content;
                return JSON.parse(fileContent);
            }
            
            async function saveFeedUrls() {
                await fetch('https://api.github.com/gists/' + GIST_ID, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': 'token ' + getToken(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: {
                            'feeds.json': {
                                content: JSON.stringify(feedUrls)
                            }
                        }
                    })
                });
            }
            
            async function fetchFeed(feedUrl) {
                const proxyUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feedUrl);
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const feedTitle = data.feed.title;
                
                return data.items.map(function(item) {
                    item.sourceName = feedTitle;
                    return item;
                });
            }
            
            async function init() {
                feedUrls = await loadFeedUrls();
                renderFeedList();
                loadAllFeeds();
            }
            //end point to feeds
            //start the core of the reader output
            async function loadAllFeeds() {
                let allItems = [];

                for (const url of feedUrls) {
                    try {
                        const items = await fetchFeed(url);
                        allItems = allItems.concat(items);
                    } catch (error) {
                        console.log('Skipping feed that failed to load:', url, error);
                    }
                }
                
                allItems.sort(function(a, b) {
                    return new Date(b.pubDate) - new Date(a.pubDate);
                });
                
                renderItems(allItems);
            }
            
            function renderItems(items) {
                const itemList = document.getElementById("itemList");
                itemList.innerHTML = ''; //clear out whatever was in there before

                items.forEach(function (item) {
                    const listItem = document.createElement("li");
                    
                    const sourceTag = document.createElement("span");
                    sourceTag.className = "tag source-tag";
                    sourceTag.textContent = item.sourceName;
                    
                    const dateTag = document.createElement("span");
                    dateTag.className = "tag date-tag";
                    dateTag.textContent = new Date(item.pubDate).toLocaleDateString();
                    
                    const link = document.createElement("a");
                    link.textContent = item.title;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    
                    if (item.link && (item.link.startsWith("http://") || item.link.startsWith("https://"))) {
                        link.href = item.link;
                    } else {
                        link.href = "#";
                    }
                    
                    listItem.appendChild(sourceTag);
                    listItem.appendChild(document.createTextNode(" "));
                    listItem.appendChild(dateTag);
                    listItem.appendChild(document.createTextNode(" "));
                    listItem.appendChild(link);
                    
                    itemList.appendChild(listItem);
                });
            }
            //end the core of the reader output
            //start add url click handler
            document.getElementById('addFeedBtn').addEventListener('click', async function() {
                const input = document.getElementById('feedUrlInput');
                const newUrl = input.value;
                
                feedUrls.push(newUrl);
                await saveFeedUrls();
                renderFeedList();
                input.value = '';
                
                loadAllFeeds();
            });
            //end add url click handler
            //start visible subscribe list
            function renderFeedList() {
                const FeedList = document.getElementById('FeedList');
                FeedList.innerHTML = '';
                
                feedUrls.forEach(function(url) {
                    const listItem = document.createElement('li');
                    listItem.textContent = url + ' ';
                    
                    const removeBtn = document.createElement('button');
                    removeBtn.textContent = 'Remove';
                    removeBtn.addEventListener('click', function() {
                        removeFeed(url);
                    });
                    
                    listItem.appendChild(removeBtn);
                    FeedList.appendChild(listItem);
                });
            }
            //end visible subscribe list
            //start delete url
            async function removeFeed(url) {
                feedUrls = feedUrls.filter(function(existingUrl) {
                    return existingUrl !== url;
                });
                
                await saveFeedUrls();
                renderFeedList();
                loadAllFeeds();
            }
            //end delete url
            init();//kickstarts everything
        </script>
    </body>
</html>
